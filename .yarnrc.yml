approvedGitRepositories:
  - "**"

enableScripts: true

# Pin the linker to node-modules explicitly. Without this, a fresh Yarn install
# in environments that do not inherit a parent-directory `.yarnrc.yml` (e.g.
# the Docker CI image and fresh GitHub Actions runners) falls back to Yarn's
# default PnP linker, which breaks `require('node-pty')` at runtime because
# the Fastify server boots plain `node src/server.js` (no Yarn PnP loader).
nodeLinker: node-modules
