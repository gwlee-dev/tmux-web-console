name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # tmux's format engine rewrites literal tabs in `-F` into underscores
    # when the locale is the C/POSIX fallback. Pin UTF-8 so src/tmux.js's
    # tab-delimited parseTable() rows stay intact. See Dockerfile for the
    # matching ENV block used by the local bootstrap image.
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # tmux: runtime dep of the app.
      # python3/make/g++: required to build node-pty's native addon during `yarn install`.
      # fontconfig: fc-cache / fc-list used by scripts/install-fonts.sh.
      # curl/unzip: used by the install-fonts.sh TTF fallback path.
      - name: Install system deps (node-pty build + tmux + fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tmux \
            python3 \
            make \
            g++ \
            fontconfig \
            curl \
            ca-certificates \
            unzip
      - run: corepack enable
      - run: yarn install --immutable

      # Register the vendored Pretendard Variable + Monoplex KR Nerd with
      # fontconfig so the chromium-linux visual regression goldens match.
      - name: Install Pretendard + Monoplex KR Nerd system fonts
        env:
          PRETENDARD_SRC_DIR: ${{ github.workspace }}/public/fonts/pretendard
          MONOPLEX_SRC_DIR: ${{ github.workspace }}/public/fonts/monoplex-kr-nerd
        run: sudo -E bash scripts/install-fonts.sh

      - run: yarn typecheck
      - run: yarn test:unit run
      - run: yarn test:coverage

      # Playwright boots the Fastify server via `node src/server.js` in
      # non-dev mode, which requires the Vite bundle in dist/.
      - run: yarn build

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Warm up tmux for Playwright webServer
        run: tmux new-session -d -s ci-warmup || true

      - name: Run Playwright (chromium)
        run: yarn test:e2e --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
